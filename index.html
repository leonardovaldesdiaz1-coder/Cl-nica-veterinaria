<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clínica Veterinaria - Citas</title>

    <link rel="stylesheet"
          href="styles.css">

</head>


<body>


    <header>

        <h1>
            Clínica Veterinaria
        </h1>

        <p>
            Gestión de citas
        </p>

    </header>


    <main>


        <section class="contenedor">

            <div class="section-header">

                <div>

                    <h2>
                        Citas existentes
                    </h2>

                    <p>
                        Administre las citas registradas
                        en el sistema.
                    </p>

                </div>


                <button
                    class="btn-recargar"
                    onclick="cargarCitas()">

                    Actualizar

                </button>

            </div>


            <div
                id="lista-citas">

                <div class="loading">
                    Cargando citas...
                </div>

            </div>


        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>
