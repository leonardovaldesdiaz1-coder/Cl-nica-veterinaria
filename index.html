<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Veterinaria - Citas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Clínica Veterinaria</h1>
        <p>Gestión de citas</p>
    </header>

    <main>
        <section class="contenedor">
            <h2>Citas existentes</h2>

            <div id="lista-citas">

                <div class="cita" data-id="1">
                    <div>
                        <h3>Max - Consulta general</h3>
                        <p><strong>Dueño:</strong> Juan Pérez</p>
                        <p>
                            <strong>Fecha:</strong>
                            <span class="fecha">2026-09-10</span>
                        </p>
                        <p>
                            <strong>Hora:</strong>
                            <span class="hora">10:00</span>
                        </p>
                    </div>

                    <div class="acciones">
                        <button class="btn-reprogramar"
                                onclick="reprogramarCita(1)">
                            Reprogramar
                        </button>

                        <button class="btn-cancelar"
                                onclick="cancelarCita(1)">
                            Cancelar
                        </button>
                    </div>
                </div>


                <div class="cita" data-id="2">
                    <div>
                        <h3>Luna - Vacunación</h3>
                        <p><strong>Dueño:</strong> María López</p>
                        <p>
                            <strong>Fecha:</strong>
                            <span class="fecha">2026-09-12</span>
                        </p>
                        <p>
                            <strong>Hora:</strong>
                            <span class="hora">12:30</span>
                        </p>
                    </div>

                    <div class="acciones">
                        <button class="btn-reprogramar"
                                onclick="reprogramarCita(2)">
                            Reprogramar
                        </button>

                        <button class="btn-cancelar"
                                onclick="cancelarCita(2)">
                            Cancelar
                        </button>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
