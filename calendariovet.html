<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calendario de citas</title>

    <link rel="stylesheet"
          href="styles.css">

</head>


<body>

    <div class="app">


        <header class="calendar-top">

            <div class="title">

                <div class="logo">
                    🐾
                </div>


                <div>

                    <h1>
                        Calendario de citas
                    </h1>

                    <p
                        class="date"
                        id="currentDate">
                    </p>

                </div>

            </div>


            <button
                class="today-btn"
                onclick="goToday()">

                Hoy

            </button>

        </header>


        <main class="calendar">


            <div class="calendar-header">

                <h2 id="calendarDate"></h2>


                <div class="arrows">

                    <button
                        onclick="previousDay()">

                        ‹

                    </button>


                    <button
                        onclick="nextDay()">

                        ›

                    </button>

                </div>

            </div>


            <div
                class="timeline"
                id="timeline">

                <div class="loading">
                    Cargando citas...
                </div>

            </div>


        </main>

    </div>


    <script src="calendario.js"></script>

</body>

</html>
